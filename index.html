<!DOCTYPE html>

<html lang="en">

	<head>

		<meta charset="utf-8">
		<title>FIFA Qualifiers — Timeline</title>
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<script src="https://d3js.org/d3.v7.min.js"></script>
		<link rel="stylesheet" href="css/style.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@200..900&display=swap" rel="stylesheet">

	</head>

	<body>

		<h1>A History of <span id="fifa">FIFA</span>
				<span id="world">World</span> <span id="cup">Cup</span> Qualifiers &#9917;</h1>
		<p class="lead">Slide through tournament years, from 1930 to the present.
				A country lights up if it qualified that year; color indicates its performance in the tournament.</p>

		<div id="viz">
			<div style="position:relative; width:100%; max-width:1200px;">
				<svg id="mapSvg" viewBox="0 0 1200 650" preserveAspectRatio="xMidYMid meet"></svg>
				<div class="tooltip" id="tooltip"></div>
			</div>
		</div>

		<div class="controls">
			<div class="slider-wrap">
				<input id="yearSlider" type="range" min="1930" max="2018" step="1" value="1930" />
				<div class="year-label" id="yearLabel">1930</div>
			</div>

			<button id="playBtn" aria-pressed="false">Play</button>

			<div class="legend" aria-hidden="true">
				<div><span class="sw" style="background:#dbe9ff"></span>Qualified this year</div>
				<div><span class="sw" style="background:#bfe0ff"></span>Qualified previously</div>
				<div><span class="sw" style="background:#efefef"></span>Never qualified</div>
			</div>
		</div>

		<script src="js/main.js"></script>

	</body>
	
</html>
